[package]
name = "kovia_atlas"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kovia_atlas"

[[bin]]
name = "kovia-atlas-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["standalone"]
standalone = [
    "bevy/bevy_winit",
    "bevy/wayland",
    "bevy/x11",
    "dep:bevy_egui",
    "dep:egui-phosphor",
]

[dependencies]
bevy.workspace = true
bevy_egui = { version = "0.41.1", optional = true }
bitflags.workspace = true
egui-phosphor = { version = "0.13", optional = true }
kovia-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
wgpu.workspace = true
