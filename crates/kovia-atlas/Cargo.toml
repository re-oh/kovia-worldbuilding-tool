[package]
name = "kovia_atlas"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "bevy_scene"] }
bevy_egui = "0.41.1"
bitflags = { version = "2.9", features = ["serde"] }
egui-phosphor = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
